<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Inventario - Registro de Clientes</title>
    <!--Favicon-->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">


    <!-- Custom fonts for this template-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2 font-weight-bold">¡Crea tu Cuenta en Pocheches Fast Food!</h1>
                                <p class="text-muted small mb-4">Regístrate para realizar y consultar tus pedidos</p>
                            </div>
                            <form class="user" id="form-registro-cliente">
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" id="reg-nombre"
                                            placeholder="Nombre" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control form-control-user" id="reg-apellido"
                                            placeholder="Apellido" required>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="email" class="form-control form-control-user" id="reg-email"
                                            placeholder="Correo Electrónico" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="tel" class="form-control form-control-user" id="reg-celular"
                                            placeholder="Celular / Teléfono" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <input type="text" class="form-control form-control-user" id="reg-direccion"
                                        placeholder="Dirección de entrega" required>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user"
                                            id="reg-password" placeholder="Contraseña" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user"
                                            id="reg-repeat-password" placeholder="Repetir Contraseña" required>
                                    </div>
                                </div>

                                <!-- Selector de Avatar para el Cliente -->
                                <div class="card p-3 mb-3 bg-light border-0">
                                    <div class="row align-items-center">
                                        <div class="col-3 text-center">
                                            <img id="reg-preview" src="img/undraw_profile.svg" class="rounded-circle border shadow-sm" style="width: 55px; height: 55px; object-fit: cover;">
                                        </div>
                                        <div class="col-9">
                                            <label class="small font-weight-bold mb-1"><i class="fas fa-palette mr-1 text-primary"></i> Elige tu Avatar:</label>
                                            <div class="d-flex flex-wrap" style="gap: 5px;">
                                                <img src="img/pochechefastfood.jpg" class="reg-avatar rounded-circle border shadow-sm" style="width: 28px; height: 28px; object-fit: cover; cursor: pointer;" title="Pocheches Logo" data-src="img/pochechefastfood.jpg">
                                                <img src="img/undraw_profile.svg" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="img/undraw_profile.svg">
                                                <img src="img/undraw_profile_1.svg" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="img/undraw_profile_1.svg">
                                                <img src="img/undraw_profile_2.svg" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="img/undraw_profile_2.svg">
                                                <img src="img/undraw_profile_3.svg" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="img/undraw_profile_3.svg">
                                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Client" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="https://api.dicebear.com/7.x/bottts/svg?seed=Client">
                                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix">
                                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka">
                                                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="reg-avatar rounded-circle border" style="width: 28px; height: 28px; cursor: pointer;" data-src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold">
                                    <i class="fas fa-check mr-1"></i> Registrarme e Ingresar
                                </button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small font-weight-bold text-primary" href="login.html">¿Ya tienes cuenta? ¡Inicia Sesión!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>

    <script src="js/registrarUsuario.js"></script>


            <div class="text-center mt-3 text-white-50 small">
                <span>Copyright &copy; Pocheches Fast Food 2026 &bull; Creado por Sebastian, Bryan y Yadir.<br>Proyecto educativo del Cesde</span>
            </div>
</body>

</html>
